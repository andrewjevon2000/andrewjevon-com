<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Verihubs Lead Quality Shift</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#fff; margin:0; padding:32px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; }
  .sub { font-size: 12px; color: #888; margin-bottom: 20px; }
  .legend { display:flex; gap:20px; margin-top:14px; font-size:12px; color:#444; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Verihubs Lead Quality Shift — Okt 2025 → Jul 2026</h1>
  <div class="sub">Data ilustratif / mock — belum ada sumber CRM/GSC riil, hanya menggambarkan arah tren</div>
  <canvas id="chart" height="150"></canvas>
  <div class="legend">
    <div><span class="dot" style="background:#e05a4e;"></span>Unqualified</div>
    <div><span class="dot" style="background:#3d8b6e;"></span>Qualified</div>
  </div>
</div>
<script>
const months = ["Okt","Nov","Des","Jan","Feb","Mar","Apr","Mei","Jun","Jul"];
const unqualified = [78, 74, 70, 64, 58, 52, 46, 40, 36, 33];
const qualified = unqualified.map(v => 100 - v);

new Chart(document.getElementById('chart').getContext('2d'), {
  type: 'bar',
  data: {
    labels: months,
    datasets: [
      { label: 'Unqualified', data: unqualified, backgroundColor: '#e05a4e', stack: 'a' },
      { label: 'Qualified', data: qualified, backgroundColor: '#3d8b6e', stack: 'a' }
    ]
  },
  options: {
    responsive: true,
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y}%` } }
    },
    scales: {
      x: { stacked: true, grid: { display: false } },
      y: { stacked: true, max: 100, ticks: { callback: (v) => v + '%' }, grid: { color: '#f0f0f0' } }
    }
  }
});
</script>
</body>
</html>
